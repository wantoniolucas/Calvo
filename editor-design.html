<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ateliê — Editor de design</title><link rel="icon" href="data:,">
<style>
:root{--bg:#eceaf3;--pn:#fff;--tx:#1d1a2b;--mu:#6c6884;--bd:#dcd8e8;--ac:#4f3df0;--on:#fff;--st:#d9d5e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--pn:#201d2e;--tx:#ecebf6;--mu:#9b97b4;--bd:#34304a;--ac:#8b7dff;--on:#15131f;--st:#2a2640;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131f;--pn:#201d2e;--tx:#ecebf6;--mu:#9b97b4;--bd:#34304a;--ac:#8b7dff;--on:#15131f;--st:#2a2640;color-scheme:dark}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font:700 18px Georgia,serif;margin:0 8px 0 0;letter-spacing:-.3px}
button,select,input{font:inherit;color:var(--tx)}
button,select{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.sp{flex:1}
main{display:grid;grid-template-columns:230px 1fr 270px;min-height:0}
aside{background:var(--pn);overflow:auto;padding:12px;min-height:0}
aside.l{border-right:1px solid var(--bd)}aside.r{border-left:1px solid var(--bd)}
h2{font:600 12px system-ui;color:var(--mu);margin:14px 0 6px}h2:first-child{margin-top:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.t{height:64px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;border-radius:8px;border:1px solid var(--bd);background:var(--st)}
#stage{overflow:auto;display:grid;place-items:center;padding:20px;min-height:0;touch-action:none}
#cv{box-shadow:0 6px 30px rgba(20,10,60,.25);background:#fff;touch-action:none;user-select:none;flex:none}
.f{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;margin:5px 0}
.f input[type=text],.f input[type=number],.f select{width:100%;box-sizing:border-box}
.f input[type=color]{width:100%;height:30px;padding:0;border:1px solid var(--bd);border-radius:6px;background:none}
.row{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.row button{flex:1;padding:5px 6px;font-size:12px}
.ly{display:flex;gap:6px;align-items:center;padding:5px 8px;border:1px solid var(--bd);border-radius:7px;margin-bottom:4px;cursor:pointer;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ly.on{border-color:var(--ac);background:var(--st)}.mu{color:var(--mu);font-size:12px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--pn);color:var(--tx);max-width:min(92vw,640px)}dialog img{max-width:100%;border:1px solid var(--bd)}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:auto minmax(260px,1fr) auto}aside{max-height:30vh}aside.l,aside.r{border:0;border-bottom:1px solid var(--bd)}}
</style></head><body><div id="app">
<header><h1>Ateliê</h1>
<button id="un" title="Desfazer (Ctrl+Z)">Desfazer</button><button id="re" title="Refazer (Ctrl+Y)">Refazer</button>
<select id="sz" aria-label="Tamanho"><optgroup label="Redes sociais"><option value="1080x1080">Post quadrado 1080×1080</option><option value="1080x1350">Post retrato 1080×1350</option><option value="1080x1920">Story / Reels 1080×1920</option><option value="1200x630">Facebook link 1200×630</option><option value="820x312">Facebook capa 820×312</option><option value="1600x900">X (Twitter) 1600×900</option><option value="1584x396">LinkedIn banner 1584×396</option><option value="1000x1500">Pinterest 1000×1500</option><option value="1280x720">YouTube miniatura 1280×720</option><option value="2560x1440">YouTube capa 2560×1440</option></optgroup><optgroup label="Apresentação"><option value="1920x1080">Widescreen 16:9 1920×1080</option><option value="1024x768">Padrão 4:3 1024×768</option></optgroup><optgroup label="Impressão (96 dpi)"><option value="794x1123">A4 794×1123</option><option value="559x794">A5 559×794</option><option value="1123x1587">A3 1123×1587</option><option value="816x1056">Carta 816×1056</option><option value="340x189">Cartão de visita 9×5 cm</option><option value="1728x2304">Pôster 18×24 pol</option></optgroup><option value="custom">Personalizado…</option></select><span id="cz" hidden style="display:inline-flex;gap:4px;align-items:center"><input id="cw" type="number" min="1" step="any" value="1080" style="width:70px" aria-label="Largura"><span class="mu">×</span><input id="ch" type="number" min="1" step="any" value="1080" style="width:70px" aria-label="Altura"><select id="cu" aria-label="Unidade"><option value="1">px</option><option value="37.795">cm</option><option value="3.7795">mm</option><option value="96">pol</option></select><button id="ca" class="p">Aplicar</button></span>
<label class="mu">Fundo <input id="bg" type="color" value="#ffffff"></label>
<button id="zo">−</button><span id="zl" class="mu">50%</span><button id="zi">+</button><button id="zf">Ajustar</button>
<span class="sp"></span><select id="sc" aria-label="Escala"><option>1</option><option selected>2</option><option>3</option></select>
<button id="ej">JSON</button><button id="es">SVG</button><button id="ep" class="p">Exportar PNG</button></header>
<main>
<aside class="l"><h2>Modelos</h2><div class="g" id="tp"></div>
<h2>Elementos</h2><div class="g" id="el"></div>
<h2>Texto</h2><div class="g"><button data-tx="Título grande">Título</button><button data-tx="Subtítulo">Subtítulo</button></div>
<h2>Seus arquivos</h2><button id="up" style="width:100%">Enviar imagem</button><input id="fi" type="file" accept="image/*" hidden>
<p class="mu">Salvo automaticamente neste navegador. Atalhos: Del, Ctrl+Z/Y, Ctrl+D, setas.</p></aside>
<div id="stage"></div>
<aside class="r"><div id="pr"></div><h2>Camadas</h2><div id="ly"></div></aside>
</main></div>
<dialog id="dg"><p class="mu">Segure ou clique com o botão direito na imagem para salvar.</p><img id="di" alt="Resultado"><p><a id="da" download="design.png">Baixar PNG</a> <button onclick="dg.close()">Fechar</button></p></dialog>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),NS='http://www.w3.org/2000/svg';
const PATHS={tri:'M50 0L100 100L0 100Z',star:'M50 0L61 35H98L68 57L79 91L50 70L21 91L32 57L2 35H39Z',heart:'M50 90C10 60 0 35 20 15C35 2 50 15 50 25C50 15 65 2 80 15C100 35 90 60 50 90Z',arrow:'M0 35H60V10L100 50L60 90V65H0Z'};
const FONTS=['system-ui, sans-serif','Georgia, serif','Impact, Haettenschweiler, sans-serif','"Courier New", monospace','"Trebuchet MS", sans-serif'];
let S={w:1080,h:1080,bg:'#ffffff',items:[]},sel=null,un=[],re=[],zoom=.5,uid=1,drag=null,raf=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=o=>({id:uid++,op:1,r:0,rx:0,...o});
const R=(x,y,w,h,fill,rx=0)=>mk({t:'rect',x,y,w,h,fill,rx});
const E=(x,y,w,h,fill)=>mk({t:'ell',x,y,w,h,fill});
const P=(k,x,y,w,h,fill)=>mk({t:'path',k,x,y,w,h,fill});
const X=(text,x,y,size,fill,font=0,bold=0)=>fit(mk({t:'text',text,x,y,size,fill,font,bold}));
function fit(i){if(i.t=='text'){i.w=Math.max(20,i.text.length*i.size*(i.bold?.6:.55));i.h=i.size*1.2}return i}
const TPL={
 'Promoção':()=>({w:1080,h:1080,bg:'#fff4d6',items:[R(0,0,1080,400,'#4f3df0'),E(720,600,520,520,'#ff6b4a'),P('star',780,70,220,220,'#ffd23f'),X('MEGA PROMO',80,110,150,'#ffffff',2),X('Até 50% off em tudo',80,300,60,'#ffd23f',0,1),X('Edite com duplo clique',80,520,56,'#1d1a2b'),R(80,700,360,110,'#1d1a2b',55),X('Compre já',130,730,52,'#ffffff',0,1)]}),
 'Apresentação':()=>({w:1920,h:1080,bg:'#14213d',items:[R(0,0,40,1080,'#fca311'),X('Título da apresentação',140,330,130,'#ffffff',1,1),X('Subtítulo ou nome do apresentador',140,540,56,'#e5e5e5'),P('arrow',140,720,160,70,'#fca311')]}),
 'Banner':()=>({w:1584,h:396,bg:'#0f766e',items:[E(1200,-120,520,520,'#14b8a6'),E(1380,200,300,300,'#99f6e4'),X('Seu nome · Sua marca',70,110,90,'#ffffff',1,1),X('Uma frase curta que explica o que você faz',70,250,40,'#ccfbf1')]}),
 'Convite':()=>({w:1080,h:1920,bg:'#fde2e4',items:[P('heart',290,200,500,460,'#e5383b'),X('Você está convidado',110,780,100,'#660708',1,1),X('Sábado · 20h',110,1000,70,'#660708'),X('Rua Exemplo, 123',110,1120,48,'#b23a48')]})};
Object.keys(TPL).forEach(k=>{const b=document.createElement('button');b.className='t';b.textContent=k;b.onclick=()=>{snap();S=TPL[k]();sel=null;sync(true)};$('#tp').append(b)});
[['Quadrado',()=>R(100,100,300,300,'#4f3df0')],['Arredondado',()=>R(100,100,360,220,'#ff6b4a',40)],['Círculo',()=>E(100,100,300,300,'#14b8a6')],['Triângulo',()=>P('tri',100,100,300,280,'#fca311')],['Estrela',()=>P('star',100,100,300,300,'#ffd23f')],['Coração',()=>P('heart',100,100,300,280,'#e5383b')],['Seta',()=>P('arrow',100,100,360,160,'#1d1a2b')],['Linha',()=>R(100,100,500,8,'#1d1a2b')]].forEach(([n,f])=>{const b=document.createElement('button');b.className='t';b.textContent=n;b.onclick=()=>add(f());$('#el').append(b)});
document.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{const big=b.dataset.tx=='Título grande';add(X(b.dataset.tx,120,120,big?120:64,'#1d1a2b',0,big))});
function snap(){un.push(JSON.stringify(S));if(un.length>100)un.shift();re=[]}
function save(){try{localStorage.setItem('atelie',JSON.stringify({S,uid}))}catch(e){}}
function add(it){snap();S.items.push(it);sel=it.id;sync(true)}
const cur=()=>S.items.find(i=>i.id==sel);
function syncSz(){const s=$('#sz');s.value=S.w+'x'+S.h;if(!s.value||s.value=='custom'){s.value='custom';$('#cz').hidden=false;$('#cu').value='1';$('#cw').value=S.w;$('#ch').value=S.h}else $('#cz').hidden=true}
function sync(p){if(p)syncSz(),$('#bg').value=S.bg;draw();layers();if(p)panel();clearTimeout(sync.t);sync.t=setTimeout(save,400)}
function draw(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;stage.innerHTML=`<svg id="cv" xmlns="${NS}" width="${S.w*zoom}" height="${S.h*zoom}" viewBox="0 0 ${S.w} ${S.h}">${body()}${overlay()}</svg>`;$('#zl').textContent=Math.round(zoom*100)+'%'})}
function node(i,ex){const tr=i.r?` transform="rotate(${i.r} ${i.x+i.w/2} ${i.y+i.h/2})"`:'',a=`${ex?'':` data-id="${i.id}"`} opacity="${i.op}"`;
 if(i.t=='rect')return`<rect${a}${tr} x="${i.x}" y="${i.y}" width="${i.w}" height="${i.h}" rx="${i.rx}" fill="${i.fill}"/>`;
 if(i.t=='ell')return`<ellipse${a}${tr} cx="${i.x+i.w/2}" cy="${i.y+i.h/2}" rx="${i.w/2}" ry="${i.h/2}" fill="${i.fill}"/>`;
 if(i.t=='path')return`<path${a} d="${PATHS[i.k]}" fill="${i.fill}" transform="${i.r?`rotate(${i.r} ${i.x+i.w/2} ${i.y+i.h/2}) `:''}translate(${i.x} ${i.y}) scale(${i.w/100} ${i.h/100})"/>`;
 if(i.t=='img')return`<image${a}${tr} href="${i.src}" x="${i.x}" y="${i.y}" width="${i.w}" height="${i.h}" preserveAspectRatio="xMidYMid slice"/>`;
 return`<text${a}${tr} x="${i.x}" y="${i.y}" dominant-baseline="hanging" font-size="${i.size}" font-family="${esc(FONTS[i.font])}" font-weight="${i.bold?800:400}" fill="${i.fill}">${esc(i.text)}</text>`}
const body=ex=>`<rect ${ex?'':'data-bg="1" '}width="${S.w}" height="${S.h}" fill="${S.bg}"/>`+S.items.map(i=>node(i,ex)).join('');
function overlay(){const i=cur();if(!i)return'';const s=2/zoom,tr=i.r?` transform="rotate(${i.r} ${i.x+i.w/2} ${i.y+i.h/2})"`:'';return`<g${tr} pointer-events="none"><rect x="${i.x}" y="${i.y}" width="${i.w}" height="${i.h}" fill="none" stroke="#4f3df0" stroke-width="${s}"/></g><rect data-h="1" x="${i.x+i.w-7*s}" y="${i.y+i.h-7*s}" width="${14*s}" height="${14*s}" rx="${3*s}" fill="#fff" stroke="#4f3df0" stroke-width="${s}" style="cursor:nwse-resize"/>`}
function layers(){$('#ly').innerHTML=[...S.items].reverse().map(i=>`<div class="ly${i.id==sel?' on':''}" data-l="${i.id}">${{rect:'▭',ell:'○',path:'★',img:'▣',text:'T'}[i.t]} ${esc(i.t=='text'?i.text:i.t=='img'?'Imagem':i.t=='path'?i.k:i.t)}</div>`).join('')||'<p class="mu">Nenhum elemento ainda.</p>';
 $('#ly').querySelectorAll('[data-l]').forEach(d=>d.onclick=()=>{sel=+d.dataset.l;sync(true)})}
function panel(){const i=cur(),p=$('#pr');if(!i){p.innerHTML='<h2>Propriedades</h2><p class="mu">Selecione um elemento no canvas ou escolha um modelo para começar.</p>';return}
 const f=(l,h)=>`<div class="f"><span class="mu">${l}</span>${h}</div>`;
 p.innerHTML='<h2>Propriedades</h2>'+(i.t=='text'?f('Texto',`<input type="text" id="p-text" value="${esc(i.text)}">`)+f('Tamanho',`<input type="number" id="p-size" min="8" max="600" value="${Math.round(i.size)}">`)+f('Fonte',`<select id="p-font">${FONTS.map((n,k)=>`<option value="${k}"${k==i.font?' selected':''}>${n.split(',')[0].replace(/"/g,'')}</option>`).join('')}</select>`)+f('Negrito',`<input type="checkbox" id="p-bold"${i.bold?' checked':''}>`):'')
 +(i.t!='img'?f('Cor',`<input type="color" id="p-fill" value="${i.fill}">`):'')
 +(i.t=='rect'?f('Cantos',`<input type="range" id="p-rx" min="0" max="200" value="${i.rx}">`):'')
 +f('Opacidade',`<input type="range" id="p-op" min="0" max="1" step=".05" value="${i.op}">`)+f('Rotação',`<input type="range" id="p-r" min="-180" max="180" value="${i.r}">`)
 +`<div class="row"><button data-a="dup">Duplicar</button><button data-a="del">Excluir</button></div><div class="row"><button data-a="up">Frente</button><button data-a="dn">Trás</button><button data-a="cx">Centro ↔</button><button data-a="cy">Centro ↕</button></div>`;
 const bind=(id,fn,ev='input')=>{const e=$('#'+id);if(e)e.addEventListener(ev,()=>{if(!bind.s){snap();bind.s=1;setTimeout(()=>bind.s=0,600)}fn(e);fit(i);sync();layers()})};
 bind('p-text',e=>i.text=e.value);bind('p-size',e=>i.size=+e.value||8);bind('p-font',e=>i.font=+e.value,'change');bind('p-bold',e=>i.bold=e.checked?1:0,'change');
 bind('p-fill',e=>i.fill=e.value);bind('p-rx',e=>i.rx=+e.value);bind('p-op',e=>i.op=+e.value);bind('p-r',e=>i.r=+e.value);
 p.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a))}
function act(a){const i=cur();if(!i)return;snap();const k=S.items.indexOf(i);
 if(a=='del'){S.items.splice(k,1);sel=null}
 if(a=='dup'){const c={...i,id:uid++,x:i.x+30,y:i.y+30};S.items.push(c);sel=c.id}
 if(a=='up'&&k<S.items.length-1)[S.items[k],S.items[k+1]]=[S.items[k+1],S.items[k]];
 if(a=='dn'&&k>0)[S.items[k],S.items[k-1]]=[S.items[k-1],S.items[k]];
 if(a=='cx')i.x=(S.w-i.w)/2;if(a=='cy')i.y=(S.h-i.h)/2;sync(true)}
function pt(e){const r=$('#cv').getBoundingClientRect();return{x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom}}
stage.addEventListener('pointerdown',e=>{const cv=$('#cv');if(!cv||!cv.contains(e.target))return;const p=pt(e),h=e.target.closest('[data-h]'),n=e.target.closest('[data-id]'),i=cur();
 if(h&&i)drag={m:'rs',i,moved:0};else if(n){sel=+n.dataset.id;const it=cur();drag={m:'mv',i:it,dx:p.x-it.x,dy:p.y-it.y,moved:0};panel();layers();draw()}else{sel=null;panel();layers();draw()}});
addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),i=drag.i;if(!drag.moved){snap();drag.moved=1}
 if(drag.m=='mv'){i.x=Math.round(p.x-drag.dx);i.y=Math.round(p.y-drag.dy)}else if(i.t=='text'){i.size=Math.max(8,(p.y-i.y)/1.2);fit(i)}else{i.w=Math.max(10,p.x-i.x);i.h=Math.max(10,p.y-i.y)}draw()});
addEventListener('pointerup',()=>{if(drag){const m=drag.moved;drag=null;if(m){panel();sync()}}});
stage.addEventListener('dblclick',e=>{const i=cur();if(i&&i.t=='text'){const t=prompt('Editar texto',i.text);if(t!=null){snap();i.text=t;fit(i);sync(true)}}});
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.target.type!='range')return;const i=cur(),c=e.ctrlKey||e.metaKey;
 if(c&&e.key=='z'){e.preventDefault();hist(un,re)}else if(c&&e.key=='y'){e.preventDefault();hist(re,un)}else if(c&&e.key=='d'){e.preventDefault();act('dup')}
 else if(i&&(e.key=='Delete'||e.key=='Backspace'))act('del');
 else if(i&&e.key.startsWith('Arrow')){e.preventDefault();snap();const d=e.shiftKey?10:1;i.x+=e.key=='ArrowRight'?d:e.key=='ArrowLeft'?-d:0;i.y+=e.key=='ArrowDown'?d:e.key=='ArrowUp'?-d:0;sync()}});
function hist(from,to){if(!from.length)return;to.push(JSON.stringify(S));S=JSON.parse(from.pop());if(!cur())sel=null;sync(true)}
$('#un').onclick=()=>hist(un,re);$('#re').onclick=()=>hist(re,un);
$('#sz').onchange=e=>{if(e.target.value=='custom'){$('#cz').hidden=false;$('#cw').focus();return}$('#cz').hidden=true;snap();[S.w,S.h]=e.target.value.split('x').map(Number);sync();fitZoom()};
$('#ca').onclick=()=>{const u=+$('#cu').value,cl=v=>Math.round(Math.min(8000,Math.max(50,v*u))),w=cl(+$('#cw').value),h=cl(+$('#ch').value);if(!(w>0&&h>0))return;snap();S.w=w;S.h=h;sync(true);fitZoom()};
['#cw','#ch'].forEach(q=>$(q).addEventListener('keydown',e=>{if(e.key=='Enter')$('#ca').click()}));
$('#bg').oninput=e=>{S.bg=e.target.value;sync()};$('#bg').onchange=()=>snap();
const setZ=z=>{zoom=Math.min(3,Math.max(.1,z));draw()};$('#zi').onclick=()=>setZ(zoom*1.2);$('#zo').onclick=()=>setZ(zoom/1.2);$('#zf').onclick=fitZoom;
function fitZoom(){setZ(Math.min((stage.clientWidth-40)/S.w,(stage.clientHeight-40)/S.h))}
stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZ(zoom*(e.deltaY<0?1.1:.9))}},{passive:false});
$('#up').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{let w=Math.min(600,im.width,S.w*.8),h=w*im.height/im.width;add(mk({t:'img',src:rd.result,x:(S.w-w)/2,y:(S.h-h)/2,w,h}))};im.src=rd.result};rd.readAsDataURL(f);e.target.value=''};
const svgStr=()=>`<svg xmlns="${NS}" width="${S.w}" height="${S.h}" viewBox="0 0 ${S.w} ${S.h}">${body(1)}</svg>`;
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
$('#es').onclick=()=>dl(new Blob([svgStr()],{type:'image/svg+xml'}),'design.svg');
$('#ej').onclick=()=>dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'design.json');
